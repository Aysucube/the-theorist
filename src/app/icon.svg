      <rect x="66" y="66" width="68" height="68" transform="rotate(45 100 100)" />
    </g>
    <path d="M100 70L126 100L100 130L74 100Z" stroke-width="4.2" fill="#8fdcff" fill-opacity="0.12" />
  </g>
  <circle cx="100" cy="100" r="17" fill="url(#eye)" />
  <circle cx="100" cy="100" r="4.5" fill="#ffffff" />
