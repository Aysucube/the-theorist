<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>The Theorist</title>
    <!--
      The welcome: the runic circle (the site's sigil, src/components/theme/sigil.tsx)
      draws itself in, turns while the app's server starts, then gathers into its
      eye. The first page opens out of that point (globals.css, portal-arrival).
      Once the app is ready it greets the user and waits for a click on the circle, then
      circuits race from it to the window's edges before it gathers in.
      main.mjs drives it through window.portal: intro (a promise), say(text) and ready().
    -->
    <style>
      :root {
        --background: #060a14;
        --foreground: #e8eefb;
        --muted: #8d9bb8;
        --accent: #5ab0ff;
        --glow: #8fdcff;
        --size: min(54vmin, 320px);
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--background);
        color: var(--foreground);
        font: 16px/1.5 "Segoe UI Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        user-select: none;
        cursor: default;
      }
      .glow {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 50% 50%, rgb(47 125 246 / 0.24), transparent 46%),
          radial-gradient(circle at 50% 50%, rgb(143 220 255 / 0.08), transparent 70%);
        opacity: 0;
      }
      .glow.idle {
        animation: breathe 5s ease-in-out infinite alternate;
      }
      /* The sigil sits exactly at the window's center, where the first page will open. */
      .stage {
        position: fixed;
        left: 50%;
        top: 50%;
        width: var(--size);
        height: var(--size);
        translate: -50% -50%;
      }
      .stage svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        color: var(--accent);
      }
      /* Once the app is ready, the circle invites a click: a ring of light keeps
         spreading from it, and it brightens under the pointer. */
      .stage.ready {
        cursor: pointer;
        border-radius: 50%;
        outline: none;
      }
      .stage.ready::after {
        content: "";
        position: absolute;
        inset: 2%;
        border-radius: 50%;
        border: 1.5px solid rgb(143 220 255 / 0.6);
        box-shadow: 0 0 24px rgb(90 176 255 / 0.35);
        pointer-events: none;
        animation: beckon 2.2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      .stage.ready svg {
        transition: filter 200ms ease-out;
      }
      @media (hover: hover) {
        .stage.ready:hover svg {
          filter: brightness(1.3) drop-shadow(0 0 14px rgb(90 176 255 / 0.5));
        }
      }
      .stage.ready:focus-visible svg {
        filter: brightness(1.3) drop-shadow(0 0 14px rgb(90 176 255 / 0.5));
      }
      .stage.entering::after {
        display: none;
      }
      @keyframes beckon {
        from {
          scale: 0.97;
          opacity: 0.9;
        }
        to {
          scale: 1.22;
          opacity: 0;
        }
      }
      /* The circuits that run from the circle to the window's edges on the way in. */
      .circuits {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: visible;
        filter: drop-shadow(0 0 4px rgb(90 176 255 / 0.85));
      }
      .circuits .trace {
        fill: none;
        stroke: #5ab0ff;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }
      .circuits .spark {
        fill: none;
        stroke: #e6f7ff;
        stroke-width: 2.6;
        stroke-linecap: round;
        stroke-dasharray: 0.05 1.2;
        stroke-dashoffset: 0.05;
      }
      .circuits .node {
        fill: #8fdcff;
        opacity: 0;
      }
      /* Only the parts that move: a transform-origin would also shift the runes' own placement. */
      .whole,
      .ticks,
      .spin,
      .runes,
      .spin-back,
      .star,
      .diamond,
      .eye,
      .eye-glow {
        transform-origin: 100px 100px;
      }
      .draw {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }
      .idle .spin {
        animation: turn 70s linear infinite;
      }
      .idle .spin-back {
        animation: turn 110s linear infinite reverse;
      }
      .idle .eye-glow {
        animation: pulse 2.6s ease-in-out infinite alternate;
      }
      .words {
        position: fixed;
        left: 0;
        right: 0;
        top: calc(50% + var(--size) / 2 + 28px);
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.01em;
        opacity: 0;
      }
      .status {
        margin: 6px 0 0;
        min-height: 1.5em;
        font-size: 13px;
        color: var(--muted);
        opacity: 0;
      }
      /* Specks of light circling the sigil. */
      .mote {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 0;
        height: 0;
        opacity: 0;
      }
      .mote::before {
        content: "";
        position: absolute;
        width: 3px;
        height: 3px;
        margin: -1.5px;
        border-radius: 50%;
        background: var(--glow);
        box-shadow: 0 0 8px 2px rgb(143 220 255 / 0.6);
        translate: var(--r) 0;
      }
      .idle .mote {
        animation:
          turn var(--t) linear var(--start) infinite,
          twinkle 3.4s ease-in-out var(--d) infinite alternate;
      }
      @keyframes turn {
        to {
          rotate: 360deg;
        }
      }
      @keyframes breathe {
        from {
          opacity: 1;
        }
        to {
          opacity: 0.72;
        }
      }
      @keyframes pulse {
        from {
          scale: 1;
        }
        to {
          scale: 1.18;
        }
      }
      @keyframes twinkle {
        from {
          opacity: 0.15;
        }
        to {
          opacity: 0.85;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .idle .spin,
        .idle .spin-back,
        .idle .eye-glow,
        .idle .mote,
        .glow.idle,
        .stage.ready::after {
          animation: none;
        }
        .mote {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <svg class="circuits" aria-hidden="true"></svg>
    <div class="stage" role="button" aria-label="Enter The Theorist" aria-disabled="true">
      <svg viewBox="0 0 200 200" fill="none" aria-hidden="true">
        <defs>
          <radialGradient id="eye" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#e6f7ff" />
            <stop offset="45%" stop-color="#8fdcff" />
            <stop offset="100%" stop-color="#2f7df6" stop-opacity="0" />
          </radialGradient>
        </defs>
        <g class="whole" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <circle class="ring-outer draw" cx="100" cy="100" r="94" pathLength="1" stroke-opacity="0.45" stroke-width="1.1" />
          <g class="ticks" stroke-opacity="0.5"></g>
          <g class="spin">
            <g class="runes" stroke-opacity="0.8" stroke-width="1.15">
              <circle cx="100" cy="100" r="80" stroke-opacity="0.4" stroke-dasharray="1 5" />
            </g>
          </g>
          <circle class="ring-mid draw" cx="100" cy="100" r="68" pathLength="1" stroke-opacity="0.55" />
          <g class="spin-back">
            <g class="star" stroke-opacity="0.6">
              <rect x="58" y="58" width="84" height="84" />
              <rect x="58" y="58" width="84" height="84" transform="rotate(45 100 100)" />
            </g>
          </g>
          <path class="arcs" d="M100 52A48 48 0 0 1 148 100M100 148A48 48 0 0 1 52 100" stroke-opacity="0.4" stroke-dasharray="2 4" />
          <g class="diamond">
            <path d="M100 66L130 100L100 134L70 100Z" stroke-opacity="0.95" stroke-width="1.5" fill="currentColor" fill-opacity="0.07" />
            <path d="M100 82L115 100L100 118L85 100Z" stroke-opacity="0.85" />
          </g>
        </g>
        <g class="eye">
          <circle class="eye-glow" cx="100" cy="100" r="13" fill="url(#eye)" />
          <circle cx="100" cy="100" r="3.2" fill="#f2fbff" />
        </g>
      </svg>
    </div>
    <div class="words">
      <h1>Welcome, Planeswalker</h1>
      <p class="status">Opening the portal…</p>
    </div>
    <script>
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const $ = (selector) => document.querySelector(selector);
      const svgNs = "http://www.w3.org/2000/svg";

      // The tick ring and the runes, as the site's sigil draws them.
      const GLYPHS = ["M-3 -4H3M0 -4V4M-3 4H3", "M-3 -4L0 0L3 -4M0 0V4", "M-3 4L0 -4L3 4M-1.5 1H1.5", "M-3 -3L3 3M3 -3L-3 3", "M0 -4V4M-3 -1L0 -4L3 -1", "M-3 -4V4M-3 0H3M3 -4V4"];
      for (let i = 0; i < 48; i++) {
        const long = i % 4 === 0;
        const tick = document.createElementNS(svgNs, "line");
        Object.entries({ x1: 100, y1: long ? 7 : 9, x2: 100, y2: 13, "stroke-width": long ? 1.4 : 0.8, transform: `rotate(${7.5 * i} 100 100)` }).forEach(([k, v]) => tick.setAttribute(k, v));
        $(".ticks").append(tick);
      }
      for (let i = 0; i < 12; i++) {
        const rune = document.createElementNS(svgNs, "path");
        rune.setAttribute("d", GLYPHS[i % GLYPHS.length]);
        rune.setAttribute("transform", `rotate(${30 * i} 100 100) translate(100 21)`);
        $(".runes").append(rune);
      }
      const motes = [
        [118, 23, 0],
        [126, 31, -1.2],
        [112, 19, -2.1],
        [134, 41, -0.6],
        [121, 27, -2.8],
        [130, 36, -1.7],
      ];
      for (const [radius, seconds, delay] of motes) {
        const mote = document.createElement("span");
        mote.className = "mote";
        // Radius in the sigil's units (100 = its edge); each starts somewhere along its circle.
        mote.style.cssText = `--r: calc(var(--size) * ${radius / 200}); --t: ${seconds}s; --d: ${delay}s; --start: ${-(Math.random() * seconds).toFixed(1)}s`;
        $(".stage").append(mote);
      }

      const OUT = "cubic-bezier(0.16, 1, 0.3, 1)";
      const POP = "cubic-bezier(0.34, 1.4, 0.64, 1)";
      const DRAW = "cubic-bezier(0.65, 0, 0.35, 1)";
      const play = (selector, keyframes, options) => $(selector).animate(keyframes, { fill: "both", easing: OUT, ...options });

      function startIdle() {
        $(".stage svg").classList.add("idle");
        $(".stage").classList.add("idle");
        $(".glow").classList.add("idle");
      }

      let opening = [];
      if (reduce) {
        opening = [play(".glow", [{ opacity: 0 }, { opacity: 1 }], { duration: 300 })];
        for (const s of [".ring-outer", ".ring-mid"]) $(s).style.strokeDashoffset = "0";
        for (const s of ["h1", ".status"]) play(s, [{ opacity: 0 }, { opacity: 1 }], { duration: 300 });
      } else {
        opening = [
          play(".glow", [{ opacity: 0 }, { opacity: 1 }], { duration: 1400 }),
          play(".ring-outer", [{ strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 1 }], { duration: 1100, easing: DRAW }),
          play(".ticks", [{ opacity: 0, transform: "rotate(-30deg)" }, { opacity: 1, transform: "rotate(0deg)" }], { duration: 1000, delay: 150 }),
          play(".runes", [{ opacity: 0, transform: "rotate(70deg) scale(0.9)" }, { opacity: 1, transform: "rotate(0deg) scale(1)" }], { duration: 1100, delay: 250 }),
          play(".ring-mid", [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: 900, delay: 350, easing: DRAW }),
          play(".star", [{ opacity: 0, transform: "rotate(-60deg) scale(0.55)" }, { opacity: 1, transform: "rotate(0deg) scale(1)" }], { duration: 1000, delay: 450 }),
          play(".arcs", [{ opacity: 0 }, { opacity: 1 }], { duration: 600, delay: 700 }),
          play(".diamond", [{ opacity: 0, transform: "scale(0.3)" }, { opacity: 1, transform: "scale(1)" }], { duration: 650, delay: 750, easing: POP }),
          play(".eye", [{ opacity: 0, transform: "scale(0)" }, { opacity: 1, transform: "scale(1.35)", offset: 0.6 }, { opacity: 1, transform: "scale(1)" }], { duration: 800, delay: 900 }),
          play("h1", [{ opacity: 0, transform: "translateY(10px)", filter: "blur(4px)" }, { opacity: 1, transform: "translateY(0)", filter: "blur(0)" }], { duration: 800, delay: 800 }),
          play(".status", [{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: 700, delay: 1050 }),
        ];
      }

      const intro = Promise.all(opening.map((a) => a.finished)).then(() => {
        startIdle();
        return true;
      });
      const finishOpening = () => opening.forEach((a) => a.finish());

      // Clicking the circle (or pressing Enter or Space) is the way in, once the app is ready;
      // asked for earlier, it goes in as soon as it is. Any other click plays the drawing at once.
      const stage = $(".stage");
      let wantIn = false;
      let letIn = null;
      function askIn() {
        finishOpening();
        wantIn = true;
        letIn?.();
      }
      stage.addEventListener("click", askIn);
      addEventListener("pointerdown", finishOpening);
      addEventListener("keydown", (event) => {
        finishOpening();
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          askIn();
        }
      });

      /**
       * Circuit traces from the circle's edge to the window's edges, as on a
       * circuit board: a short spoke out of the circle, then straight runs with
       * a jog, each lighting the points where it turns. Laid out for the
       * window's size when it's clicked.
       */
      function drawCircuits() {
        const svg = $(".circuits");
        const width = innerWidth;
        const height = innerHeight;
        svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        svg.replaceChildren();
        const box = stage.getBoundingClientRect();
        const cx = box.left + box.width / 2;
        const cy = box.top + box.height / 2;
        const radius = (box.width / 2) * 0.94;
        const runs = [];
        const COUNT = 14;
        for (let i = 0; i < COUNT; i++) {
          const angle = (i / COUNT) * Math.PI * 2 + 0.12 + (Math.random() - 0.5) * 0.16;
          const dx = Math.cos(angle);
          const dy = Math.sin(angle);
          const start = [cx + dx * radius, cy + dy * radius];
          const spoke = 18 + Math.random() * 26;
          const out = [cx + dx * (radius + spoke), cy + dy * (radius + spoke)];
          const points = [start, out];
          if (Math.abs(dx) > Math.abs(dy)) {
            const edge = dx > 0 ? width + 8 : -8;
            const mid = out[0] + (edge - out[0]) * (0.3 + Math.random() * 0.35);
            const jog = (dy >= 0 ? 1 : -1) * (14 + Math.random() * 46);
            points.push([mid, out[1]], [mid + Math.sign(edge - mid) * Math.abs(jog), out[1] + jog], [edge, out[1] + jog]);
          } else {
            const edge = dy > 0 ? height + 8 : -8;
            const mid = out[1] + (edge - out[1]) * (0.3 + Math.random() * 0.35);
            const jog = (dx >= 0 ? 1 : -1) * (14 + Math.random() * 46);
            points.push([out[0], mid], [out[0] + jog, mid + Math.sign(edge - mid) * Math.abs(jog)], [out[0] + jog, edge]);
          }
          const d = points.map(([x, y], n) => `${n ? "L" : "M"}${x.toFixed(1)} ${y.toFixed(1)}`).join("");
          const trace = document.createElementNS(svgNs, "path");
          Object.entries({ d, class: "trace", pathLength: 1 }).forEach(([k, v]) => trace.setAttribute(k, v));
          const spark = document.createElementNS(svgNs, "path");
          Object.entries({ d, class: "spark", pathLength: 1 }).forEach(([k, v]) => spark.setAttribute(k, v));
          svg.append(trace, spark);
          // The turns light up as the trace reaches them.
          const nodes = points.slice(2, 4).map(([x, y]) => {
            const node = document.createElementNS(svgNs, "circle");
            Object.entries({ cx: x.toFixed(1), cy: y.toFixed(1), r: 2.6, class: "node" }).forEach(([k, v]) => node.setAttribute(k, v));
            svg.append(node);
            return node;
          });
          runs.push({ trace, spark, nodes, delay: Math.random() * 160 });
        }
        return runs;
      }

      async function goIn() {
        stage.classList.add("entering");
        stage.setAttribute("aria-disabled", "true");
        if (reduce) {
          await document.body.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: "forwards" }).finished;
          return;
        }
        const IN = "cubic-bezier(0.7, 0, 0.84, 0)";
        const RUN = 720;
        const runs = drawCircuits();
        const surge = [
          play(".words", [{ opacity: 1, transform: "translateY(0)" }, { opacity: 0, transform: "translateY(8px)" }], { duration: 260, easing: "ease-in" }),
          play(".eye", [{ transform: "scale(1)" }, { transform: "scale(1.7)" }], { duration: 260, easing: OUT }),
          ...runs.flatMap(({ trace, spark, nodes, delay }) => [
            trace.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: RUN, delay, easing: "cubic-bezier(0.45, 0, 0.2, 1)", fill: "both" }),
            spark.animate([{ strokeDashoffset: 0.05 }, { strokeDashoffset: -1 }], { duration: RUN, delay, easing: "cubic-bezier(0.45, 0, 0.2, 1)", fill: "both" }),
            ...nodes.map((node, n) =>
              node.animate([{ opacity: 0, scale: 0 }, { opacity: 1, scale: 1.8, offset: 0.5 }, { opacity: 0.9, scale: 1 }], {
                duration: 360,
                delay: delay + RUN * (0.45 + n * 0.18),
                easing: OUT,
                fill: "both",
              }),
            ),
          ]),
        ];
        await Promise.all(surge.map((a) => a.finished));
        // The circuits are lit; the circle draws itself into its eye, leaving a point where the first page opens.
        const gather = [
          $(".circuits").animate([{ opacity: 1 }, { opacity: 0 }], { duration: 640, easing: "ease-in", fill: "forwards" }),
          ...[...document.querySelectorAll(".mote")].map((mote) => mote.animate([{ opacity: getComputedStyle(mote).opacity }, { opacity: 0 }], { duration: 300, fill: "forwards" })),
          play(".runes", [{ transform: "rotate(0deg) scale(1)" }, { transform: "rotate(260deg) scale(1)" }], { duration: 700, easing: IN }),
          play(".whole", [{ transform: "rotate(0deg) scale(1)", opacity: 1 }, { transform: "rotate(-120deg) scale(0.04)", opacity: 0.25 }], { duration: 700, easing: IN }),
          play(".eye", [{ transform: "scale(1.7)" }, { transform: "scale(2.1)", offset: 0.3 }, { transform: "scale(0.22)" }], { duration: 700, easing: "cubic-bezier(0.45, 0, 0.55, 1)" }),
          play(".glow", [{ opacity: 1 }, { opacity: 0 }], { duration: 640, easing: "ease-in" }),
        ];
        await Promise.all(gather.map((a) => a.finished));
      }

      let saying = Promise.resolve();
      window.portal = {
        /** Resolves once the circle has drawn itself in. */
        intro,

        /** Shows what's happening under the greeting, fading from the last line. */
        say(text) {
          saying = saying.then(async () => {
            const status = $(".status");
            if (status.textContent === text) return;
            if (!reduce) await status.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 140, fill: "forwards" }).finished;
            status.textContent = text;
            status.animate([{ opacity: 0 }, { opacity: 1 }], { duration: reduce ? 0 : 260, fill: "forwards", easing: OUT });
          });
          return saying;
        },

        /** The app is ready: the circle invites a click, then plays the way in. Resolves when it's done. */
        async ready() {
          await intro;
          stage.classList.add("ready");
          stage.tabIndex = 0;
          stage.setAttribute("aria-disabled", "false");
          if (!wantIn) {
            stage.focus({ preventScroll: true });
            await this.say("Click the circle to enter");
            // A click while that line was fading in counts too.
            if (!wantIn) await new Promise((resolve) => (letIn = resolve));
          }
          await goIn();
          return true;
        },
      };
    </script>
  </body>
</html>
